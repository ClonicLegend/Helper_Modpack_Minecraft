<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mod Tracker Workspace</title>
<link rel="stylesheet" href="mod_tracker.css">
</head>
<body>

<div id="topbar">
  <h1>⛏️ Mod Tracker Workspace</h1>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="returnToHub()">🏠 Main Menu</button>
  <button class="tb-btn" onclick="verifyJsonAttributes()" style="background: #1a2936; border-color: #ffc107; color: #ffc107;">🔍 Verify Integrity</button>
  <button class="tb-btn save" id="disk-save-btn" onclick="commitChangesToDisk()">💾 Save mod_tracker.json</button>
  <div class="tb-spacer"></div>
  <div class="search-container">
    <span>🔍</span>
    <input type="text" class="search-input" id="search-bar" placeholder="Search mods or notes..." oninput="renderModCardsList()">
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="sidebar-title">Filter by Category</div>
    <div class="category-list" id="category-injector"></div>
    <div class="sidebar-controls">
      <button class="tb-btn action-btn-wide" onclick="triggerAddCategory()">+ New Category</button>
    </div>
  </div>

  <div id="content-area">
    <div class="content-header">
      <div class="content-title" id="active-cat-title">All Mods</div>
      <div class="content-actions" id="cat-action-group">
        <button class="tb-btn" style="background:var(--card);" onclick="triggerAddModCard()">➕ Add Mod</button>
        <button class="tb-btn" id="rename-cat-btn" onclick="triggerRenameCategory()" style="display:none;">✎ Rename</button>
        <button class="tb-btn" id="delete-cat-btn" style="background:var(--danger); color:white; display:none;" onclick="triggerDeleteCategory()">🗑 Delete Cat.</button>
      </div>
    </div>
    <div class="stats-lbl" id="stats-counter-lbl"></div>
    <div class="mods-grid" id="mods-grid-injector"></div>
  </div>
</div>

<div class="modal-overlay" id="mod-modal" style="display: none;">
  <div class="modal">
    <h3 id="modal-header-title">Add Mod Parameters</h3>
    <div class="fg">
      <label class="fl">Categories * (select one or more)</label>
      <div class="category-checkbox-list" id="form-mod-categories"></div>
    </div>
    <div class="fg">
      <label class="fl">Mod Name *</label>
      <input type="text" class="fi" id="form-mod-name" placeholder="e.g., Applied Energistics 2">
    </div>
    <div class="fg">
      <label class="fl">Mod ID (in-game namespace)</label>
      <input type="text" class="fi" id="form-mod-namespace" placeholder="e.g., cataclysm  →  cataclysm:...">
      <div class="id-hint">The part before the colon in in-game ids. Every mob of this mod gets it as a prefix.</div>
    </div>
    <div class="fg">
      <label class="fl">Link (URL)</label>
      <input type="text" class="fi" id="form-mod-link" placeholder="https://curseforge.com/...">
    </div>
    <div class="fg">
      <label class="fl">Image URL or Local Folder File</label>
      <input type="text" class="fi" id="form-mod-image" placeholder="Paste link or local path...">
    </div>
    <div class="fg">
      <label class="fl">Notes</label>
      <textarea class="fi" id="form-mod-notes" rows="3" style="resize:vertical;" placeholder="Key automation setups, dependency alerts..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="ok" onclick="saveFormModalData()">✓ Save</button>
      <button class="cancel" onclick="closeFormModal()">✕ Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="mob-modal" style="display: none;">
  <div class="modal">
    <h3 id="mob-modal-header-title">Add Mob</h3>
    <div class="fg">
      <label class="fl">Mob Name *</label>
      <input type="text" class="fi" id="form-mob-name" placeholder="e.g., Ender Dragon">
    </div>
    <div class="fg">
      <label class="fl">In-game name (entity id)</label>
      <input type="text" class="fi" id="form-mob-entity" placeholder="e.g., ender_dragon" oninput="updateMobIdPreview()">
      <div class="id-hint">Full in-game id: <code id="mob-id-preview">—</code></div>
    </div>
    <div class="fg">
      <label class="fl">Image URL or Local Folder File</label>
      <input type="text" class="fi" id="form-mob-image" placeholder="Paste link or local path...">
    </div>
    <div class="fg">
      <label class="fl">Attributes</label>
      <div class="attr-grid" id="form-mob-attrs"></div>
    </div>
    <div class="modal-btns">
      <button class="ok" onclick="saveMobFormModalData()">✓ Save</button>
      <button class="cancel" onclick="closeMobFormModal()">✕ Cancel</button>
    </div>
  </div>
</div>

<script src="mod_tracker.js"></script>
</body>
</html>
