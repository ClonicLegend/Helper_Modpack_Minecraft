<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mod Tracker Workspace</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --card: #0f3460;
  --card-h: #1a4a80;
  --accent: #4caf50;
  --accent2: #81c784;
  --dirt: #795548;
  --gold: #ffc107;
  --text: #e8f5e9;
  --subtext: #a5d6a7;
  --danger: #ef5350;
  --border: #2e4070;
  --entry-bg: #0d2137;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* TOP BAR */
#topbar {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 8px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  z-index: 100;
}
#topbar h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
.tb-btn {
  background: var(--dirt);
  border: none;
  color: #fff;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  display: flex; align-items: center; gap: 5px;
  transition: background 0.15s;
}
.tb-btn:hover { background: #8d6253; }
.tb-btn.save { background: var(--accent); color: var(--bg); }
.tb-btn.save:hover { background: var(--accent2); }
.tb-sep { width: 1px; height: 22px; background: var(--border); }
.tb-spacer { flex: 1; }

.search-container {
  display: flex; align-items: center; gap: 6px;
  background: var(--entry-bg); border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 6px;
}
.search-input {
  background: none; border: none; color: var(--text); outline: none; font-size: 13px; width: 180px;
}

/* MAIN LAYOUT */
#main { display: flex; flex: 1; overflow: hidden; }

/* LEFT SIDEBAR: CATEGORIES */
#sidebar {
  width: 240px; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; pading: 14px 0;
}
.sidebar-title { font-size: 11px; font-weight: bold; color: var(--subtext); letter-spacing: 1px; padding: 14px 14px 6px; text-transform: uppercase; }
.category-list { flex: 1; overflow-y: auto; padding: 0 8px; }

.category-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; margin-bottom: 4px; border-radius: 6px; cursor: pointer;
  border: 1px solid transparent; transition: all 0.15s;
}
.category-item:hover { background: var(--card); border-color: var(--border); }
.category-item.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.category-item.active .cat-count { background: rgba(0,0,0,0.15); color: var(--bg); }
.cat-name { font-size: 13px; font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; flex: 1; }
.cat-count { font-size: 11px; background: var(--entry-bg); color: var(--subtext); padding: 2px 6px; border-radius: 12px; font-weight: bold; margin-left: 6px; }

.sidebar-controls { padding: 10px; border-top: 1px solid var(--border); }
.action-btn-wide { width: 100%; text-align: center; justify-content: center; }

/* RIGHT PANEL: CONTENT LISTING */
#content-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.content-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 8px; }
.content-title { font-size: 18px; font-weight: bold; color: var(--gold); }
.content-actions { display: flex; gap: 8px; }

.stats-lbl { font-size: 11px; color: var(--subtext); padding: 0 22px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); }

.mods-grid { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }

/* MOD CARDS */
.mod-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; display: flex; align-items: center; gap: 16px; transition: background 0.15s;
}
.mod-card:hover { background: var(--card-h); border-color: var(--accent); }
.mod-img-wrap { width: 64px; height: 64px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: var(--entry-bg); display: flex; align-items: center; justify-content: center; }
.mod-img { width: 100%; height: 100%; object-fit: cover; }
.mod-icon-placeholder { font-size: 28px; }

.mod-info { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.mod-name { font-size: 15px; font-weight: bold; color: var(--gold); }
.mod-link { font-size: 11px; color: var(--subtext); text-decoration: none; word-break: break-all; width: fit-content; }
.mod-link:hover { text-decoration: underline; color: var(--accent2); }
.mod-notes { font-size: 12px; color: var(--text); line-height: 1.4; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.mod-card-actions { display: flex; gap: 6px; }
.icon-btn { background: none; border: none; font-size: 14px; cursor: pointer; padding: 6px; border-radius: 4px; transition: background 0.1s; }
.icon-btn.edit { color: var(--accent2); }
.icon-btn.edit:hover { background: rgba(129, 199, 132, 0.15); }
.icon-btn.del { color: var(--danger); }
.icon-btn.del:hover { background: rgba(239, 83, 80, 0.15); }

.empty-state { text-align: center; margin: auto; color: var(--subtext); font-size: 13px; line-height: 1.6; padding: 40px; }
.empty-state-icon { font-size: 40px; margin-bottom: 8px; color: var(--accent); }

/* MODAL CONFIG OVERLAYS */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 420px; max-width: 95vw; }
.modal h3 { font-size: 16px; margin-bottom: 16px; color: var(--gold); }
.fg { margin-bottom: 12px; }
.fl { display: block; font-size: 11px; color: var(--subtext); margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }
.fi { width: 100%; background: var(--entry-bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; font-size: 13px; outline: none; }
.fi:focus { border-color: var(--accent); }
.modal-btns { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
.modal-btns button { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; border: none; }
.modal-btns .ok { background: var(--accent); color: var(--bg); }
.modal-btns .cancel { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<div id="topbar">
  <h1>⛏️ Mod Tracker Workspace</h1>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="returnToHub()">🏠 Main Menu</button>
  <button class="tb-btn save" id="disk-save-btn" onclick="commitChangesToDisk()" style="display: none;">💾 Sync File Data</button>
  <div class="tb-spacer"></div>
  <div class="search-container">
    <span>🔍</span>
    <input type="text" class="search-input" id="search-bar" placeholder="Search mods or notes..." oninput="renderModCardsList()">
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="sidebar-title">Categories</div>
    <div class="category-list" id="category-injector"></div>
    <div class="sidebar-controls">
      <button class="tb-btn action-btn-wide" onclick="triggerAddCategory()">+ New Category</button>
    </div>
  </div>

  <div id="content-area">
    <div class="content-header">
      <div class="content-title" id="active-cat-title">← Select a Category</div>
      <div class="content-actions" id="cat-action-group" style="display: none;">
        <button class="tb-btn" style="background:var(--card);" onclick="triggerAddModCard()">➕ Add Mod</button>
        <button class="tb-btn" onclick="triggerRenameCategory()">✎ Rename</button>
        <button class="tb-btn" style="background:var(--danger); color:white;" onclick="triggerDeleteCategory()">🗑 Delete Cat.</button>
      </div>
    </div>
    <div class="stats-lbl" id="stats-counter-lbl"></div>
    <div class="mods-grid" id="mods-grid-injector"></div>
  </div>
</div>

<div class="modal-overlay" id="mod-modal" style="display: none;">
  <div class="modal">
    <h3 id="modal-header-title">Add Mod Parameters</h3>
    <div class="fg">
      <label class="fl">Mod Name *</label>
      <input type="text" class="fi" id="form-mod-name" placeholder="e.g., Applied Energistics 2">
    </div>
    <div class="fg">
      <label class="fl">Link (URL)</label>
      <input type="text" class="fi" id="form-mod-link" placeholder="https://curseforge.com/...">
    </div>
    <div class="fg">
      <label class="fl">Image URL or Local Folder File</label>
      <input type="text" class="fi" id="form-mod-image" placeholder="Paste link or local path...">
    </div>
    <div class="fg">
      <label class="fl">Notes</label>
      <textarea class="fi" id="form-mod-notes" rows="3" style="resize:vertical;" placeholder="Key automation setups, dependency alerts..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="ok" onclick="saveFormModalData()">✓ Save</button>
      <button class="cancel" onclick="closeFormModal()">✕ Cancel</button>
    </div>
  </div>
</div>

<script>
let currentFileName = "";
let dataset = { categories: {} }; 
let activeCategory = null;
let editingModReference = null;

window.addEventListener('DOMContentLoaded', () => {
  const incomingFile = sessionStorage.getItem('active_project_filename');
  const incomingData = sessionStorage.getItem('active_project_payload');
  
  if (incomingFile && incomingData) {
    try {
      currentFileName = incomingFile;
      document.getElementById('disk-save-btn').style.display = 'inline-flex';
      document.getElementById('disk-save-btn').textContent = `💾 Save to ${currentFileName}`;
      
      const parsed = JSON.parse(incomingData);
      dataset = parsed.categories ? parsed : { categories: parsed };
      
      const categoriesKeys = Object.keys(dataset.categories);
      if(categoriesKeys.length > 0) {
        selectActiveCategory(categoriesKeys[0]);
      }
    } catch(e) {
      console.error(e);
    }
  }
  renderCategorySidebar();
});

function returnToHub() { window.location.href = "index.html"; }

function renderCategorySidebar() {
  const container = document.getElementById('category-injector');
  container.innerHTML = '';
  
  const categories = Object.keys(dataset.categories || {});
  if (categories.length === 0) {
    container.innerHTML = `<div style="font-size:11px; text-align:center; padding:20px; color:var(--subtext);">No categories.</div>`;
    return;
  }
  
  categories.forEach(cat => {
    const count = dataset.categories[cat].length;
    const isActive = cat === activeCategory;
    
    const div = document.createElement('div');
    div.className = `category-item ${isActive ? 'active' : ''}`;
    div.innerHTML = `
      <span class="cat-name">${escapeHtml(cat)}</span>
      <span class="cat-count">${count}</span>
    `;
    div.onclick = () => selectActiveCategory(cat);
    container.appendChild(div);
  });
}

function selectActiveCategory(cat) {
  activeCategory = cat;
  document.getElementById('active-cat-title').textContent = cat ? `⛏  ${cat}` : '← Select a Category';
  document.getElementById('cat-action-group').style.display = cat ? 'flex' : 'none';
  renderCategorySidebar();
  renderModCardsList();
}

function renderModCardsList() {
  const grid = document.getElementById('mods-grid-injector');
  grid.innerHTML = '';
  
  if (!activeCategory) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📂</div>Choose a dashboard category section profile from the sidebar to inspect records.</div>`;
    return;
  }
  
  let mods = dataset.categories[activeCategory] || [];
  const query = document.getElementById('search-bar').value.toLowerCase().trim();
  
  if (query) {
    mods = mods.filter(m => m.name.toLowerCase().includes(query) || (m.notes || '').toLowerCase().includes(query));
  }
  
  document.getElementById('stats-counter-lbl').textContent = `${mods.length} entries tracked ${query ? `matching query filtering context` : ''}`;
  
  if (mods.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🌿</div>
        No target tracker data metrics match active visibility queries.
      </div>`;
    return;
  }
  
  mods.forEach(mod => {
    const card = document.createElement('div');
    card.className = 'mod-card';
    
    let imgHTML = `<div class="mod-icon-placeholder">📦</div>`;
    if (mod.image) {
      imgHTML = `<img class="mod-img" src="${escapeHtml(mod.image)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><div class="mod-icon-placeholder" style="display:none;">📦</div>`;
    }
    
    card.innerHTML = `
      <div class="mod-img-wrap">${imgHTML}</div>
      <div class="mod-info">
        <span class="mod-name">${escapeHtml(mod.name)}</span>
        ${mod.link ? `<a class="mod-link" href="${escapeHtml(mod.link)}" target="_blank">${escapeHtml(mod.link)}</a>` : ''}
        ${mod.notes ? `<p class="mod-notes">${escapeHtml(mod.notes)}</p>` : ''}
      </div>
      <div class="mod-card-actions">
        <button class="icon-btn edit" title="Edit Properties">✎</button>
        <button class="icon-btn del" title="Purge Record">✕</button>
      </div>
    `;
    
    card.querySelector('.edit').onclick = () => openFormModal(mod);
    card.querySelector('.del').onclick = () => triggerDeleteModCard(mod);
    grid.appendChild(card);
  });
}

/* CRUD OPERATIONS LAYER */
function triggerAddCategory() {
  let name = prompt("Enter new category metric identifier:");
  if (!name || !name.trim()) return;
  name = name.trim();
  if (dataset.categories[name]) { alert("Category profile collision error!"); return; }
  dataset.categories[name] = [];
  selectActiveCategory(name);
}

function triggerRenameCategory() {
  if (!activeCategory) return;
  let newName = prompt("Modify tracking moniker classification name:", activeCategory);
  if (!newName || !newName.trim() || newName.trim() === activeCategory) return;
  newName = newName.trim();
  
  dataset.categories[newName] = dataset.categories[activeCategory];
  delete dataset.categories[activeCategory];
  selectActiveCategory(newName);
}

function triggerDeleteCategory() {
  if (!activeCategory || !confirm(`Purge category "${activeCategory}" along with all tracking children data arrays inside?`)) return;
  delete dataset.categories[activeCategory];
  const remaining = Object.keys(dataset.categories);
  selectActiveCategory(remaining.length > 0 ? remaining[0] : null);
}

function triggerAddModCard() {
  openFormModal(); // Launches the input panel to create a new mod card record
}

function openFormModal(mod = null) {
  editingModReference = mod;
  document.getElementById('modal-header-title').textContent = mod ? "Edit Mod Reference Mapping" : "Track New Mod Element";
  document.getElementById('form-mod-name').value = mod ? mod.name : "";
  document.getElementById('form-mod-link').value = mod ? mod.link || "" : "";
  document.getElementById('form-mod-image').value = mod ? mod.image || "" : "";
  document.getElementById('form-mod-notes').value = mod ? mod.notes || "" : "";
  document.getElementById('mod-modal').style.display = 'flex';
}

function cancelFormModal() {
  closeFormModal();
}

function closeFormModal() {
  document.getElementById('mod-modal').style.display = 'none';
  editingModReference = null;
}

function saveFormModalData() {
  const name = document.getElementById('form-mod-name').value.trim();
  if (!name) { alert("Mod parameter tracking rules call for a valid Name property."); return; }
  
  const payload = {
    name,
    link: document.getElementById('form-mod-link').value.trim(),
    image: document.getElementById('form-mod-image').value.trim(),
    notes: document.getElementById('form-mod-notes').value.trim()
  };
  
  if (editingModReference) {
    const idx = dataset.categories[activeCategory].indexOf(editingModReference);
    if(idx !== -1) dataset.categories[activeCategory][idx] = payload;
  } else {
    dataset.categories[activeCategory].push(payload);
  }
  
  closeFormModal();
  renderCategorySidebar();
  renderModCardsList();
}

function triggerDeleteModCard(mod) {
  if (!confirm(`Purge reference matrix records for "${mod.name}"?`)) return;
  dataset.categories[activeCategory] = dataset.categories[activeCategory].filter(m => m !== mod);
  renderCategorySidebar();
  renderModCardsList();
}

function commitChangesToDisk() {
  sessionStorage.setItem('active_project_payload', JSON.stringify(dataset, null, 2));
  sessionStorage.setItem('trigger_disk_write_back', 'true');
  alert("Edits cached successfully! Return to Hub Menu overview interface to register confirmation logs on filesystem streams.");
}

function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
